<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>影片清單</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h2>影片管理</h2>
    <span id="welcomeUser"></span>
    <button id="logoutBtn" style="display:none;">登出</button>
  </div>

  <div class="container">
    <h3>影片上傳</h3>
    <div id="uploadSection" style="display:none;">
      <form id="uploadForm">
        <input type="file" id="fileInput" accept="video/*"><br>
        <button type="submit" id="uploadBtn">上傳</button>
        <progress id="progressBar" value="0" max="100"></progress>
        <div id="status" class="status"></div>
      </form>
    </div>
    <h3>我的影片清單 <button onclick="loadVideos()">🔄 重新整理</button></h3>
    <div id="videoList"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
